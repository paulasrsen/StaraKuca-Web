<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5a3d"/>
      <stop offset="55%" stop-color="#a9714f"/>
      <stop offset="100%" stop-color="#1f6f78"/>
    </linearGradient>
    <pattern id="stones" width="120" height="80" patternUnits="userSpaceOnUse">
      <rect width="120" height="80" fill="none"/>
      <rect x="4" y="4" width="52" height="32" rx="4" fill="rgba(255,255,255,0.06)"/>
      <rect x="64" y="4" width="52" height="32" rx="4" fill="rgba(255,255,255,0.04)"/>
      <rect x="4" y="44" width="52" height="32" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="64" y="44" width="52" height="32" rx="4" fill="rgba(255,255,255,0.07)"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <rect width="1600" height="1000" fill="url(#stones)"/>
  <text x="800" y="480" font-family="Georgia, serif" font-size="46" fill="rgba(255,255,255,0.85)" text-anchor="middle">Apartman Stara Kuća</text>
  <text x="800" y="540" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)" text-anchor="middle">Zamijenite ovu sliku glavnom fotografijom apartmana (images/hero.svg → hero.jpg)</text>
</svg>
